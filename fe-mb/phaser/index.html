<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- "Forged & Lit" type voice: Cinzel = engraved heraldic display (titles,
         names, places); EB Garamond = readable old-style serif body/lore.
         Numbers stay tabular mono (defined in index.css). SELF-HOSTED variable
         woff2 (public/fonts) — no CDN dependency, no flash-of-Georgia, works
         offline in the desktop shell. -->
    <link
      rel="preload"
      href="/fonts/cinzel-normal-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/eb-garamond-normal-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link href="/fonts/fonts.css" rel="stylesheet" />
    <title>FE_MB — tactical roguelite</title>
  </head>
  <body>
    <div id="root" class="relative h-screen w-screen"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
