<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FE_MB Map Builder</title>
<style>
  :root {
    --bg: #16181c; --panel: #1e2127; --panel2: #23272e; --edge: #333842;
    --text: #e6e3dc; --dim: #98a0ad; --accent: #d9a93f; --accent2: #6aa9d9;
    --danger: #c4553f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.45 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  button, select, input { font: inherit; color: inherit; }
  button {
    background: var(--panel2); border: 1px solid var(--edge); border-radius: 3px;
    padding: 5px 10px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); color: #17140c; border-color: var(--accent); font-weight: 600; }
  button.danger:hover { border-color: var(--danger); color: var(--danger); }
  input[type=number], input[type=text], select {
    background: #14161a; border: 1px solid var(--edge); border-radius: 3px; padding: 4px 6px;
  }
  input[type=number] { width: 58px; }
  :focus-visible { outline: 2px solid var(--accent2); outline-offset: 1px; }

  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--edge);
  }
  header h1 { font-size: 14px; margin: 0 8px 0 0; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
  .grp { display: flex; align-items: center; gap: 6px; }
  .grp label { color: var(--dim); font-size: 12px; }
  .sep { width: 1px; height: 22px; background: var(--edge); }

  main { flex: 1; display: flex; min-height: 0; }

  /* ---- palette ---- */
  #palette {
    width: 320px; flex: none; background: var(--panel); border-right: 1px solid var(--edge);
    display: flex; flex-direction: column; min-height: 0;
  }
  .pal-head { padding: 8px; border-bottom: 1px solid var(--edge); display: flex; flex-direction: column; gap: 6px; }
  .cats { display: flex; flex-wrap: wrap; gap: 4px; }
  .cats button { padding: 3px 8px; font-size: 12px; }
  #search { width: 100%; }
  #tiles {
    flex: 1; overflow-y: auto; padding: 8px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 6px; align-content: start;
  }
  .sw {
    /* a light checker, so a transition tile's alpha shape reads at a glance */
    position: relative; aspect-ratio: 1;
    background-color: #8d949e;
    background-image:
      linear-gradient(45deg, #6d747e 25%, transparent 25%, transparent 75%, #6d747e 75%),
      linear-gradient(45deg, #6d747e 25%, transparent 25%, transparent 75%, #6d747e 75%);
    background-size: 12px 12px;
    background-position: 0 0, 6px 6px;
    border: 1px solid var(--edge); border-radius: 3px; cursor: pointer; overflow: hidden;
  }
  .sw img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .sw:hover { border-color: var(--accent2); }
  .sw.sel { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(217,169,63,.35); }
  .sw .cap {
    position: absolute; left: 0; right: 0; bottom: 0; font-size: 8px; line-height: 1.2;
    background: rgba(0,0,0,.72); color: #cfd4dc; padding: 1px 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ---- stage ---- */
  #stage { flex: 1; overflow: auto; display: grid; place-items: center; padding: 20px; min-width: 0; background: #101216; }
  #wrap { position: relative; box-shadow: 0 0 0 1px var(--edge), 0 10px 40px -18px #000; }
  #wrap canvas { display: block; position: absolute; inset: 0; }
  #base { position: relative !important; }
  #over { pointer-events: none; }

  /* ---- right rail ---- */
  #rail {
    width: 260px; flex: none; background: var(--panel); border-left: 1px solid var(--edge);
    display: flex; flex-direction: column; min-height: 0; overflow-y: auto;
  }
  .sec { padding: 10px; border-bottom: 1px solid var(--edge); display: flex; flex-direction: column; gap: 8px; }
  .sec h2 { margin: 0; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
  .layer {
    display: flex; align-items: center; gap: 6px; padding: 5px 6px;
    border: 1px solid var(--edge); border-radius: 3px; background: var(--panel2); cursor: pointer;
  }
  .layer.active { border-color: var(--accent); background: #2b2a1f; }
  .layer .nm { flex: 1; font-size: 12px; }
  .layer .n { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
  .layer input[type=checkbox] { accent-color: var(--accent); }
  .layer .half {
    font-size: 9px; padding: 1px 4px; border-radius: 2px; border: 1px solid var(--edge);
    color: var(--dim); background: #16181c;
  }
  .layer .half.on { color: #17140c; background: var(--accent2); border-color: var(--accent2); font-weight: 700; }
  .hint { color: var(--dim); font-size: 11px; line-height: 1.5; }
  .hint b { color: var(--text); }
  kbd {
    background: #121418; border: 1px solid var(--edge); border-bottom-width: 2px;
    border-radius: 3px; padding: 0 4px; font: 11px ui-monospace, monospace;
  }
  textarea {
    width: 100%; height: 120px; background: #0e1013; color: var(--dim);
    border: 1px solid var(--edge); border-radius: 3px; font: 11px ui-monospace, monospace; padding: 6px;
  }
  .row { display: flex; gap: 6px; }
  .row > * { flex: 1; }
  #status { color: var(--dim); font-size: 11px; min-height: 15px; }
</style>
</head>
<body>

<header>
  <h1>FE_MB Map Builder</h1>
  <div class="grp">
    <label>cols</label><input id="cols" type="number" value="26" min="4" max="80">
    <label>rows</label><input id="rows" type="number" value="18" min="4" max="60">
    <label>cell</label><input id="cell" type="number" value="48" min="16" max="128">
    <button id="resize">Apply</button>
  </div>
  <div class="sep"></div>
  <div class="grp">
    <button id="tPaint" class="on">Paint</button>
    <button id="tErase">Erase</button>
    <button id="tPick">Pick</button>
    <button id="tFill">Fill</button>
  </div>
  <div class="sep"></div>
  <div class="grp">
    <button id="undo">Undo</button>
    <button id="redo">Redo</button>
    <button id="gridBtn" class="on">Grid</button>
  </div>
  <div class="sep"></div>
  <div class="grp">
    <label>scale</label><input id="oscale" type="number" value="100" min="20" max="400" step="10">
    <label style="color:var(--dim)">%</label>
  </div>
</header>

<main>
  <aside id="palette">
    <div class="pal-head">
      <input id="search" type="text" placeholder="search sprites...">
      <div class="cats" id="cats"></div>
    </div>
    <div id="tiles"></div>
  </aside>

  <div id="stage">
    <div id="wrap">
      <canvas id="base"></canvas>
      <canvas id="over"></canvas>
    </div>
  </div>

  <aside id="rail">
    <div class="sec">
      <h2>Layers</h2>
      <div id="layers"></div>
      <div class="hint">
        <b>½</b> toggles a half-cell offset for that layer &mdash; that is what makes a dual-grid
        transition layer sit on the corners of the layer below it.
      </div>
    </div>

    <div class="sec">
      <h2>Controls</h2>
      <div class="hint">
        <kbd>drag</kbd> paint &middot; <kbd>right-drag</kbd> erase<br>
        <kbd>alt</kbd>+click pick &middot; <kbd>1</kbd>&ndash;<kbd>6</kbd> layer<br>
        <kbd>ctrl</kbd>+<kbd>Z</kbd> undo &middot; <kbd>ctrl</kbd>+<kbd>shift</kbd>+<kbd>Z</kbd> redo<br>
        <kbd>[</kbd> <kbd>]</kbd> object scale
      </div>
    </div>

    <div class="sec">
      <h2>Save</h2>
      <div class="row">
        <button id="saveJson">Save .json</button>
        <button id="savePng">Save .png</button>
      </div>
      <div class="row">
        <button id="copyJson">Copy JSON</button>
        <button id="loadBtn">Load .json</button>
      </div>
      <input id="fileIn" type="file" accept=".json,application/json" hidden>
      <div id="status"></div>
      <textarea id="dump" readonly placeholder="Copy JSON puts the map here too, in case the download is blocked."></textarea>
      <button id="clear" class="danger">Clear all layers</button>
    </div>
  </aside>
</main>

      var pix = m.k.indexOf("px_") === 0 || m.k.indexOf("k_") === 0 ? ' style="image-rendering:pixelated"' : "";
      d.innerHTML = '<img alt=""' + pix + ' src="' + src + '"><span class="cap">' + m.l + "</span>";
      d.onclick = function () { selected = m.k; renderPalette(); };
      host.appendChild(d);
    });
  }
  document.getElementById("search").addEventListener("input", function (e) {
    query = e.target.value.trim().toLowerCase(); renderPalette();
  });

  // ---------- layers ui ----------
  function refreshLayers() {
    var host = document.getElementById("layers");
    host.innerHTML = "";
    LAYERS.forEach(function (l, i) {
      var d = document.createElement("div");
      d.className = "layer" + (i === active ? " active" : "");
      d.onclick = function (ev) { if (ev.target.tagName !== "INPUT" && !ev.target.classList.contains("half")) { active = i; refreshLayers(); drawOverlay(); } };
      var cb = document.createElement("input");
      cb.type = "checkbox"; cb.checked = l.vis;
      cb.onchange = function () { l.vis = cb.checked; draw(); };
      var nm = document.createElement("span");
      nm.className = "nm"; nm.textContent = (i + 1) + ". " + l.name;
      var half = document.createElement("span");
      half.className = "half" + (l.half ? " on" : "");
      half.textContent = "½";
      half.title = "half-cell offset (dual-grid)";
      half.onclick = function (ev) { ev.stopPropagation(); l.half = !l.half; refreshLayers(); draw(); };
      var n = document.createElement("span");
      n.className = "n"; n.textContent = Object.keys(l.cells).length;
      d.appendChild(cb); d.appendChild(nm); d.appendChild(half); d.appendChild(n);
      host.appendChild(d);
    });
  }

  // ---------- toolbar ----------
  function setTool(t) {
    tool = t;
    [["paint","tPaint"],["erase","tErase"],["pick","tPick"],["fill","tFill"]].forEach(function (p) {
      document.getElementById(p[1]).classList.toggle("on", tool === p[0]);
    });
  }
  document.getElementById("tPaint").onclick = function () { setTool("paint"); };
  document.getElementById("tErase").onclick = function () { setTool("erase"); };
  document.getElementById("tPick").onclick  = function () { setTool("pick"); };
  document.getElementById("tFill").onclick  = function () { setTool("fill"); };
  document.getElementById("gridBtn").onclick = function () {
    showGrid = !showGrid; this.classList.toggle("on", showGrid); drawOverlay();
  };
  document.getElementById("undo").onclick = function () {
    if (undoStack.length) { redoStack.push(snapshot()); restore(undoStack.pop()); }
  };
  document.getElementById("redo").onclick = function () {
    if (redoStack.length) { undoStack.push(snapshot()); restore(redoStack.pop()); }
  };
  document.getElementById("oscale").onchange = function () { objScale = +this.value || 100; };
  document.getElementById("resize").onclick = function () {
    cols = +document.getElementById("cols").value || 26;
    rows = +document.getElementById("rows").value || 18;
    cell = +document.getElementById("cell").value || 48;
    sizeCanvas(); draw();
  };
  document.getElementById("clear").onclick = function () {
    pushUndo();
    LAYERS.forEach(function (l) { l.cells = {}; });
    draw(); refreshLayers(); status("cleared");
  };

  // ---------- io ----------
  function status(s) { document.getElementById("status").textContent = s; }
  function mapJson() {
    return JSON.stringify({
      version: 1, cols: cols, rows: rows, cell: cell,
      layers: LAYERS.map(function (l) {
        return { name: l.name, visible: l.vis, halfOffset: l.half, cells: l.cells };
      })
    }, null, 1);
  }
  function download(name, blob) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  document.getElementById("saveJson").onclick = function () {
    download("marches-map.json", new Blob([mapJson()], { type: "application/json" }));
    status("saved marches-map.json");
  };
  document.getElementById("copyJson").onclick = function () {
    var t = mapJson();
    document.getElementById("dump").value = t;
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(
      function () { status("copied to clipboard"); },
      function () { status("in the box below — select and copy"); });
    else status("in the box below — select and copy");
  };
  document.getElementById("savePng").onclick = function () {
    var g = showGrid; showGrid = false; drawOverlay();
    base.toBlob(function (b) { download("marches-map.png", b); showGrid = g; drawOverlay(); status("saved marches-map.png"); });
  };
  document.getElementById("loadBtn").onclick = function () { document.getElementById("fileIn").click(); };
  document.getElementById("fileIn").onchange = function (e) {
    var f = e.target.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var d = JSON.parse(rd.result);
        cols = d.cols || cols; rows = d.rows || rows; cell = d.cell || cell;
        document.getElementById("cols").value = cols;
        document.getElementById("rows").value = rows;
        document.getElementById("cell").value = cell;
        (d.layers || []).forEach(function (dl, i) {
          if (!LAYERS[i]) LAYERS[i] = { name: dl.name, vis: true, half: false, cells: {} };
          LAYERS[i].name = dl.name || LAYERS[i].name;
          LAYERS[i].vis = dl.visible !== false;
          LAYERS[i].half = !!dl.halfOffset;
          LAYERS[i].cells = dl.cells || {};
        });
        sizeCanvas(); draw(); refreshLayers(); status("loaded " + f.name);
      } catch (err) { status("could not read that file"); }
    };
    rd.readAsText(f);
  };

  sizeCanvas();
  refreshLayers();
  setTool("paint");
  boot();
})();
</script>
</body>
</html>
